server {
    listen 80;
    server_name _;
    root /var/www/html;
    index index.php;
    client_max_body_size 32m;
    absolute_redirect off;

    location ~* ^/(core|setup|_build|_backup)(/|$) { return 404; }
    location ~ /\. { return 404; }
    location ~* (?:^|/)config\.core\.php$ { return 404; }
    location ~* \.(sql|log|bak|dist|xml|ini|sh|tpl)$ { return 404; }
    location / { try_files $uri $uri/ @modx; }
    location @modx { rewrite ^/(.*)$ /index.php?q=$1&$args last; }
    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
        fastcgi_param SERVER_NAME $host;
        fastcgi_pass php:9000;
        fastcgi_read_timeout 120s;
    }
}
