name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, dom, zip
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
      - run: composer validate --strict
      - run: composer lint
      - run: composer test
      - run: composer audit
      - run: php scripts/build-installer.php && git diff --exit-code -- install.sh
      - run: sh -n install.sh
  installer:
    name: Installer on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea # v2
        with:
          php-version: '8.5'
          extensions: curl, dom, zip
          coverage: none
          tools: composer:v2
      - name: Install test shells
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends zsh fish
      - run: composer install --no-interaction --prefer-dist
      - run: vendor/bin/phpunit --filter BootstrapInstallerTest
      - run: sh install.sh --help
      - run: php scripts/smoke-installer.php
  integration:
    name: Docker + PHAR integration
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea # v2
        with:
          php-version: '8.5'
          extensions: curl, dom, zip
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
      - run: composer build
      - run: php dist/modx.phar --version
      - run: sha256sum --check SHA256SUMS
        working-directory: dist
      - run: php scripts/smoke.php "$PWD/dist/modx.phar"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: modx-phar
          path: |
            dist/modx.phar
            dist/install.sh
            dist/SHA256SUMS
